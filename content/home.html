<section class="notes-layout">
    <div class="panel">
        <h2>Быстрая заметка</h2>
        <form id="note-form" class="stack-form">
            <label class="field-label" for="note-input">Текст заметки</label>
            <input type="text" id="note-input" placeholder="Например: подготовить отчёт" required>
            <button class="button primary" type="submit">Добавить заметку</button>
        </form>
    </div>

    <div class="panel">
        <h2>Напоминание</h2>
        <form id="reminder-form" class="stack-form">
            <label class="field-label" for="reminder-text">Текст напоминания</label>
            <input type="text" id="reminder-text" placeholder="Например: созвон с командой" required>

            <label class="field-label" for="reminder-time">Дата и время</label>
            <input type="datetime-local" id="reminder-time" required>

            <button class="button accent" type="submit">Добавить с напоминанием</button>
        </form>
    </div>
</section>

<section class="panel notes-panel">
    <div class="notes-header">
        <div>
            <h2>Список заметок</h2>
            <p class="muted">Обычные заметки и записи с push-напоминаниями.</p>
        </div>
        <button id="clear-notes" class="button ghost" type="button">Очистить всё</button>
    </div>
    <ul id="notes-list" class="notes-list"></ul>
</section>
